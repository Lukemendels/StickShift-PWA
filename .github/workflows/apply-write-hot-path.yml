name: Apply write hot-path patch

on:
  push:
    branches:
      - agent/write-hot-path
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/write-hot-path

      - name: Apply patch
        run: python scripts/patch-write-hot-path.py

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/fs.js
          node --check assets/js/packets.js
          node --check sw.js
          git diff --check -- assets/js/fs.js assets/js/packets.js index.html sw.js

      - name: Commit product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/fs.js assets/js/packets.js index.html sw.js
          git commit -m "Optimize write packet hot path"
          git push origin HEAD:agent/write-hot-path
