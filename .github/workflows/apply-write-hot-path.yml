name: Validate write hot-path patch

on:
  push:
    branches:
      - agent/write-hot-path
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/write-hot-path

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/fs.js
          node --check assets/js/packets.js
          node --check sw.js

      - name: Assert hot-path contract
        run: |
          grep -q 'generateIndexesForPaths(r.paths)' assets/js/packets.js
          grep -q 'refresh deferred' assets/js/packets.js
          grep -q 'async function generateIndexesForPaths' assets/js/fs.js
          grep -q 'assets/js/fs.js?v=6' index.html
          grep -q 'assets/js/packets.js?v=6' index.html
          git diff --check origin/main...HEAD -- assets/js/fs.js assets/js/packets.js index.html sw.js
